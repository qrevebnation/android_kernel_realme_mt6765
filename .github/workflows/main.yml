name: Endfield

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'select branch or id commit'
        required: true
        default: 'wip'
        type: string
      localversion:
        description: 'Custom LOCALVERSION (e.g., -MyKernel)'
        required: true
        default: '-Endfield 🪐'
        type: string
      defconfig:
        description: 'pilih defconfig lain kalo mau (exm. nethunter)'
        required: true
        default: 'endfield_defconfig'
        type: string
      toolchain:
        description: 'Pilih Toolchain Clang'
        required: true
        default: 'clang-r383902'
        type: choice
        options:
          - 'clang-r383902'
          - 'proton-clang'
          - 'aosp-clang-14'
      build_user:
        description: 'set user (xxx@host)'
        required: true
        default: 'qrevebnation'
        type: string
      build_host:
        description: 'set host (user@xxx)'
        required: true
        default: 'Darkness'
        type: string
  push:
    branches:
      - wip

env:
  KBUILD_BUILD_USER: ${{ github.event.inputs.build_user || 'qrevebnation' }}
  KBUILD_BUILD_HOST: ${{ github.event.inputs.build_host || 'Darkness' }}
  LOCALVERSION: ${{ github.event.inputs.localversion || '-Endfield 🪐' }}
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || github.ref }}
        fetch-depth: 1

    - name: Setup Environment
      run: |
        echo "Build User: $KBUILD_BUILD_USER"
        echo "Build Host: $KBUILD_BUILD_HOST"
        echo "DATE=$(date +%Y-%m-%d-%H-%M-%S)" >> $GITHUB_ENV
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android10-release
        
        TOOLCHAIN="${{ github.event.inputs.toolchain || 'clang-r383902' }}"
        if [ "$TOOLCHAIN" = "proton-clang" ]; then
          echo "Cloning Proton-Clang (Optimized LLVM 13 with Polly)..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
        elif [ "$TOOLCHAIN" = "aosp-clang-14" ]; then
          echo "Downloading AOSP Clang-14 (r450784d)..."
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784d.tar.gz
          mkdir clang
          tar -xzf clang-r450784d.tar.gz -C clang/
          rm clang-r450784d.tar.gz
        else
          echo "Downloading AOSP Clang-11 (r383902)..."
          wget https://android.googlesource.com/platform//prebuilts/clang/host/linux-x86/+archive/3857008389202edac32d57008bb8c99d2c957f9d/clang-r383902.tar.gz
          mkdir clang
          tar -xzf clang-r383902.tar.gz -C clang/
          rm clang-r383902.tar.gz
        fi

        echo "$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/aarch64-linux-android-4.9/bin:/usr/bin:/bin" >> $GITHUB_PATH
        sed -i -E 's/\bpython2\b ?//g; s/  +/ /g' package
        bash package
     
    - name: check clang
      run: |
       clang -v

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
          swap-size-gb: 5

    - name: Build Kernel
      run: |
        make CC=clang ARCH=arm64 O=~/out ${{ github.event.inputs.defconfig || 'endfield_defconfig' }}
        make CC=clang ARCH=arm64 O=~/out olddefconfig
        make CC=clang ARCH=arm64 O=~/out -j$(nproc) \
          HEADER_ARCH=arm64 \
          SUBARCH=arm64 \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          STRIP=llvm-strip \
          READELF=llvm-readelf \
          CROSS_COMPILE=aarch64-linux-android- \
          CLANG_TRIPLE=aarch64-linux-gnu- 2>&1 | tee ~/build.log

    - name: Upload Build Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-log
        path: ~/build.log

    - name: anykernel ~ zipping
      run: |
         ANYKERNEL=$GITHUB_WORKSPACE/kali-nethunter-kernel/anykernel3
         mv ~/out/arch/arm64/boot/Image.gz $ANYKERNEL/
         
         # Copy modules to both vendor and system for 100% WiFi & BT compatibility
         mkdir -p $ANYKERNEL/modules/vendor/lib/modules
         mkdir -p $ANYKERNEL/modules/system/lib/modules
         find ~/out -name "*.ko" -exec cp {} $ANYKERNEL/modules/vendor/lib/modules/ \;
         find ~/out -name "*.ko" -exec cp {} $ANYKERNEL/modules/system/lib/modules/ \;
         
         # Build Standalone Magisk WiFi & BT Module as backup
         MAGISK_DIR=$GITHUB_WORKSPACE/wifi_bt_magisk
         mkdir -p $MAGISK_DIR/system/vendor/lib/modules
         mkdir -p $MAGISK_DIR/system/lib/modules
         find ~/out -name "*.ko" -exec cp {} $MAGISK_DIR/system/vendor/lib/modules/ \;
         find ~/out -name "*.ko" -exec cp {} $MAGISK_DIR/system/lib/modules/ \;
         cat << 'EOF' > $MAGISK_DIR/module.prop
id=endfield_wifi_bt_fix
name=Endfield Kernel WiFi & BT Fix
version=1.0
versionCode=1
author=qrevebnation
description=Overlay kernel modules to fix WiFi and Bluetooth for Realme MT6765 on custom ROMs
EOF
         cd $MAGISK_DIR
         zip -r9 $ANYKERNEL/WiFi-BT-Fix-Magisk.zip *
         
         # Package AnyKernel3 Zip
         cd $ANYKERNEL
         ZIP_NAME="Endfield-Kernel-Realme-MT6765-${{ github.run_id }}.zip"
         zip -r9 "$ZIP_NAME" * -x "WiFi-BT-Fix-Magisk.zip"

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      continue-on-error: true
      with:
        files: |
          kali-nethunter-kernel/anykernel3/*.zip
        name: Endfield-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        token: ${{ secrets.MY_TOKEN || secrets.GITHUB_TOKEN }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-And-WiFi-Fix
        path: kali-nethunter-kernel/anykernel3/*.zip
